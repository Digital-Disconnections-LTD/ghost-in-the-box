name: Garden checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: MCP stdio smoke (newline JSON, and Content-Length through mcp-bridge)
        run: python -m unittest discover -s tests -p test_mcp_smoke.py -v
      - name: Build the distribution
        run: python -m build
      - name: Command-line smoke
        run: |
          ghost-in-the-box --help
          ghost-in-the-box doctor
          ghost-in-the-box instagram-mcp --list-tools
          ghost-in-the-box instagram-mcp --list-tools --format md
  windows-login:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install login development tools
        run: python -m pip install -e ".[dev,login]"
      - name: Offline portable login, account and connector tests
        run: |
          $files = "test_login.py", "test_linkedin_adapter.py", "test_portable_threads.py",
            "test_portable_locking.py", "test_accounts.py", "test_instagram_session.py"
          foreach ($file in $files) {
            python -m unittest discover -s tests -p $file -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Command-line smoke
        run: |
          ghost-in-the-box login --help
          ghost-in-the-box linkedin --help
          ghost-in-the-box doctor
